# Straw Log behind nginx. Replace logs.corp.example with your hostname.

server {
    listen 80;
    server_name logs.corp.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name logs.corp.example;

    ssl_certificate     /etc/nginx/certs/strawlog.crt;   # server cert + intermediates
    ssl_certificate_key /etc/nginx/certs/strawlog.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The hub sends its own CSP, X-Frame-Options etc.; HSTS is only added when it serves TLS itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://strawlog:8080;

        # Required: the hub rejects state-changing requests whose Origin doesn't match Host (CSRF).
        # $http_host keeps a non-default port, so Origin and Host still match on e.g. :8443.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live tail is a long-lived server-sent event stream.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }
}
